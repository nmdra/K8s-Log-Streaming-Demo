apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      serviceAccountName: fluentd
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z log-cluster-kafka-bootstrap.kafka.svc.cluster.local 9092; do
                echo "Waiting for Kafka..."; sleep 5;
              done
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1-debian-kafka
          env:
            - name: FLUENT_KAFKA_BROKERS
              value: log-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: FLUENT_KAFKA_DEFAULT_TOPIC
              value: app-logs
            - name: FLUENTD_SYSTEMD_CONF
              value: disable
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: fluentd-config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
      terminationGracePeriodSeconds: 30
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: fluentd-config
          configMap:
            name: fluentd-config
