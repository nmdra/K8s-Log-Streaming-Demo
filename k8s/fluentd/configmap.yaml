apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
data:
  fluent.conf: |
    # ── Sources ──────────────────────────────────────────────────────────────
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type json
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>

    # ── Kubernetes metadata enrichment ────────────────────────────────────────
    <filter kubernetes.**>
      @type kubernetes_metadata
    </filter>

    # ── Routing: tag error-level records separately ───────────────────────────
    <match kubernetes.**>
      @type rewrite_tag_filter
      <rule>
        key     level
        pattern /^error$/
        tag     kafka.error
      </rule>
      <rule>
        key     level
        pattern /.*/
        tag     kafka.app
      </rule>
    </match>

    # ── Forward error logs → error-logs topic ────────────────────────────────
    <match kafka.error>
      @type kafka2
      brokers "#{ENV['FLUENT_KAFKA_BROKERS']}"
      default_topic error-logs
      required_acks -1
      <format>
        @type json
      </format>
      <buffer>
        flush_interval 5s
        retry_max_times 5
      </buffer>
    </match>

    # ── Forward all other logs → app-logs topic ───────────────────────────────
    <match kafka.app>
      @type kafka2
      brokers "#{ENV['FLUENT_KAFKA_BROKERS']}"
      default_topic app-logs
      required_acks -1
      <format>
        @type json
      </format>
      <buffer>
        flush_interval 5s
        retry_max_times 5
      </buffer>
    </match>
