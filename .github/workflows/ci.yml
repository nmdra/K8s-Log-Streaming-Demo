name: ci

on:
  pull_request:
    paths:
      - "log-producer/**"
      - "log-consumer/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/go-service.yml"
  push:
    branches:
      - main
    paths:
      - "log-producer/**"
      - "log-consumer/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/go-service.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: log-producer
          - service: log-consumer

    uses: ./.github/workflows/go-service.yml
    with:
      service: ${{ matrix.service }}
