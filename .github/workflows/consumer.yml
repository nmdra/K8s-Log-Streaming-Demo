name: consumer

on:
  pull_request:
    paths:
      - "log-consumer/**"
      - ".github/workflows/consumer.yml"
  push:
    branches:
      - main
    tags:
      - "consumer-v*"
    paths:
      - "log-consumer/**"
      - ".github/workflows/consumer.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-consumer
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/log-consumer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: log-consumer/go.mod

      - name: Run tests
        run: go test ./...

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: log-consumer
          format: table
          severity: HIGH,CRITICAL

      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/consumer-v')
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/consumer-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        if: startsWith(github.ref, 'refs/tags/consumer-v')
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.15.0
          distribution: goreleaser
          workdir: log-consumer
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
